<app-navbar></app-navbar>

<main class="user-form-page">
  <section class="user-form-card">
    <span class="eyebrow">Account management</span>
    <h1>Add User</h1>
    <p>Create an administrator or regular user account.</p>

    <form [formGroup]="userForm" (ngSubmit)="saveUser()" novalidate>
      <label for="username">Username</label>
      <input id="username" type="text" formControlName="username" autocomplete="off">
      <small *ngIf="userForm.controls.username.invalid && (userForm.controls.username.touched || submitted)">Use letters, numbers, or underscore.</small>

      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password">
      <small *ngIf="userForm.controls.password.invalid && (userForm.controls.password.touched || submitted)">Password must be at least 6 characters.</small>

      <label for="role">Role</label>
      <select id="role" formControlName="role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit">Create User</button>
    </form>
  </section>
</main>
